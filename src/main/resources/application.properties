spring.datasource.url=jdbc:mysql://localhost:3306/confession_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.example.confessionwall

# Map SQL create_time to the entity createTime property.
mybatis.configuration.map-underscore-to-camel-case=true
